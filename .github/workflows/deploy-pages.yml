name: SITEPRO audit and deploy Margin

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  audit:
    name: Browser, responsive and accessibility audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audit dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local site server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/margin-site.log 2>&1 &
          echo $! > /tmp/margin-site.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/margin-site.log
          exit 1
      - name: Run SITEPRO browser audit
        run: npm run test:sitepro
      - name: Upload screenshots and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margin-sitepro-audit
          path: sitepro-artifacts/
          if-no-files-found: warn

  deploy:
    name: Deploy audited website
    needs: audit
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare production files
        run: |
          mkdir -p _site
          cp index.html style.css script.js favicon.svg _site/
          touch _site/.nojekyll
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
  live-smoke:
    name: Verify the published GitHub Pages site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audit dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the new deployment to be available
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error https://patu-art.github.io/student-assignment-manager/ -o /tmp/margin-live.html 2>/dev/null && grep -q "Margin — Student Assignment Manager" /tmp/margin-live.html; then
              exit 0
            fi
            sleep 5
          done
          echo "The expected Margin deployment was not available at the public URL."
          cat /tmp/margin-live.html 2>/dev/null || true
          exit 1
      - name: Run browser audit against the published site
        env:
          BASE_URL: https://patu-art.github.io/student-assignment-manager/
        run: npm run test:sitepro
      - name: Upload live-site screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margin-live-sitepro-audit
          path: sitepro-artifacts/
          if-no-files-found: warn
